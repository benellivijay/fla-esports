name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build FLA ESPORTS APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: client/flutter_app
        run: flutter pub get

      - name: 🔑 Setup Release Keystore & Print SHA-1 Fingerprint
        run: |
          KEYSTORE_PATH="client/flutter_app/android/app/fla_release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias flakey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flaesports2026 \
              -keypass flaesports2026 \
              -dname "CN=FLA ESPORTS, OU=Mobile, O=FLA, L=Mumbai, ST=Maharashtra, C=IN"
          fi
          
          echo "=========================================================="
          echo "GOOGLE OAUTH 2.0 SHA-1 CERTIFICATE FINGERPRINTS:"
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias flakey -storepass flaesports2026 | grep -E "(SHA1|SHA256)"
          echo "Package Name: com.flaesports.tournament"
          echo "=========================================================="
          
          echo "### 🔑 Google OAuth 2.0 SHA-1 Fingerprint (Copy for Google Cloud / Firebase)" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name**: \`com.flaesports.tournament\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias flakey -storepass flaesports2026 | grep -E "(SHA1|SHA256)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build Release APK
        working-directory: client/flutter_app
        run: flutter build apk --release

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fla-esports-release-apk
          path: client/flutter_app/build/app/outputs/flutter-apk/app-release.apk
