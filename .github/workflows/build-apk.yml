name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build FLA ESPORTS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Clean up Old Workflow Artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const artifact of res.data.artifacts) {
                console.log(`Deleting old artifact: ${artifact.name} (ID: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
              console.log('Artifact cleanup completed.');
            } catch (err) {
              console.log('Notice: Could not clean old artifacts (may lack permissions or already clean):', err.message);
            }

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: client/flutter_app
        run: flutter pub get

      - name: 🔑 Setup Release Keystore & Print SHA-1 Fingerprint
        run: |
          KEYSTORE_PATH="client/flutter_app/android/app/fla_release.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            if ! keytool -list -keystore "$KEYSTORE_PATH" -alias flakey -storepass flaesports2026 >/dev/null 2>&1; then
              echo "Existing keystore invalid or missing alias flakey, recreating standard keystore..."
              rm -f "$KEYSTORE_PATH"
            fi
          fi
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias flakey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flaesports2026 \
              -keypass flaesports2026 \
              -dname "CN=FLA ESPORTS, OU=Mobile, O=FLA, L=Mumbai, ST=Maharashtra, C=IN"
          fi
          
          echo "=========================================================="
          echo "GOOGLE OAUTH 2.0 SHA-1 CERTIFICATE FINGERPRINTS:"
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias flakey -storepass flaesports2026 || true
          echo "Package Name: com.flaesports.tournament"
          echo "=========================================================="
          
          echo "### 🔑 Google OAuth 2.0 SHA-1 Fingerprint (Copy for Google Cloud / Firebase)" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name**: \`com.flaesports.tournament\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias flakey -storepass flaesports2026 | grep -E "(SHA1|SHA256)" >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 🔨 Build Release APK
        working-directory: client/flutter_app
        run: flutter build apk --release

      - name: 🚀 Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "FLA ESPORTS Release v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🎮 FLA ESPORTS Official Android Release
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Download Link**: Tap `app-release.apk` below to download directly to your Android device without unzipping!
          files: client/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Release APK (Optional Artifact Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fla-esports-release-apk
          path: client/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
