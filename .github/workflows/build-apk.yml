name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build FLA ESPORTS APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure Release Signing Key & Output SHA-1
        working-directory: client/flutter_app/android/app
        run: |
          keytool -genkey -v -keystore release.keystore -alias fla-esports -keyalg RSA -keysize 2048 -validity 10000 -storepass flaesports2026 -keypass flaesports2026 -dname "CN=FLA Esports, OU=Gaming, O=FLA, L=Mumbai, ST=Maharashtra, C=IN"
          
          SHA1_FINGERPRINT=$(keytool -list -v -keystore release.keystore -alias fla-esports -storepass flaesports2026 | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FINGERPRINT=$(keytool -list -v -keystore release.keystore -alias fla-esports -storepass flaesports2026 | grep "SHA256:" | head -n 1 | awk '{print $2}')
          
          echo "### 🔑 Google Sign-In Credentials" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name**: \`com.flaesports.tournament\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-1 Fingerprint**: \`$SHA1_FINGERPRINT\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Fingerprint**: \`$SHA256_FINGERPRINT\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Add this **SHA-1 Fingerprint** in **Firebase Console** (Project Settings ➔ Your Apps ➔ Add Fingerprint) or **Google Cloud Console** (OAuth 2.0 Client IDs for Android)." >> $GITHUB_STEP_SUMMARY
          
          echo "=========================================================="
          echo "PACKAGE NAME: com.flaesports.tournament"
          echo "SHA-1 FINGERPRINT: $SHA1_FINGERPRINT"
          echo "=========================================================="

      - name: 📦 Install Flutter Dependencies
        working-directory: client/flutter_app
        run: flutter pub get

      - name: 🔨 Build Release APK
        working-directory: client/flutter_app
        run: flutter build apk --release

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fla-esports-release-apk
          path: client/flutter_app/build/app/outputs/flutter-apk/app-release.apk
