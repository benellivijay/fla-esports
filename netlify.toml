[build]
  base = "admin_dashboard"
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://fla-esports-api.onrender.com/api/v1"

[[redirects]]
  from = "/api/*"
  to = "https://fla-esports-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
